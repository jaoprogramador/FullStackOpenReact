services:
  # Servicio de Nginx (Proxy inverso)
  nginx:
    image: nginx:1.20.1
    container_name: nginx
    ports:
      - 8080:80  # Exponemos el puerto 8080 del host al puerto 80 de Nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro  # Montamos la configuración de Nginx
    depends_on:
      - frontend
      - backend  # Nginx depende de que frontend y backend estén disponibles

  # Servicio frontend
  frontend:
    build:
      context: ./todo-frontend
      dockerfile: Dockerfile  # Usamos el Dockerfile de producción
    container_name: todo-frontend
    ports:
      - "80"  # El puerto expuesto dentro del contenedor, Nginx manejará las conexiones

  # Servicio backend
  backend:
    build:
      context: ./todo-backend
      dockerfile: Dockerfile  # Usamos el Dockerfile de producción
    container_name: todo-backend
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongo:27017/todoapp
    depends_on:
      - mongo
      - redis  # El backend depende de MongoDB y Redis

  # Servicio MongoDB
  mongo:
    image: mongo:6
    container_name: mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  # Servicio Redis
  redis:
    image: redis:7
    container_name: redis
    volumes:
      - redis-data:/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
