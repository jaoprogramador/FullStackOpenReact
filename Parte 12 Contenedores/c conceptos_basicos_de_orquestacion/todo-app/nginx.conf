events {}

http {
    server {
        listen 80;

        # Serve frontend for root requests
        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Apunta al servicio frontend (en el contenedor "todo-frontend")
            proxy_pass http://todo-frontend:80;
        }

        # Serve backend for API requests
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Asegúrate de que el backend reciba las peticiones correctamente
            proxy_pass http://todo-backend:5000/;  # Ajuste en el puerto del backend
        }
    }
}
