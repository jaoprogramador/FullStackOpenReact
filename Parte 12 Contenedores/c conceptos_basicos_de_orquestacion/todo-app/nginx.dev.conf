#Ejercicio 12.18:
events {}

http {
    server {
        listen 80;

        # Requests to the root (/) are handled by the frontend
        location / {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            proxy_pass http://todo-frontend:3000;
        }

        # Requests starting with /api/ are handled by the backend
        location /api/ {
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;

            # Removes /api prefix before forwarding to the backend
            proxy_pass http://todo-backend:3001/;
        }
    }
}

