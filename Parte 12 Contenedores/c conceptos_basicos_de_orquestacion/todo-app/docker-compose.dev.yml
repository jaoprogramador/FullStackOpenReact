services:
  # Frontend service
  frontend:
    build:
      context: ./todo-frontend
      dockerfile: dev.Dockerfile
    container_name: my-app-frontend
    volumes:
      - ./todo-frontend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - VITE_BACKEND_URL=http://nginx/api # Nginx es quien maneja las solicitudes hacia el backend
    # No se expone el puerto directamente, se accede a través de Nginx

  # Backend service
  backend:
    build:
      context: ./todo-backend
      dockerfile: dev.Dockerfile
    container_name: my-app-backend
    volumes:
      - ./todo-backend:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URL=mongodb://mongo:27017/todoapp
    depends_on:
      - mongo
      - redis
    # No se expone el puerto directamente, se accede a través de Nginx

  # Nginx service
  nginx:
    image: nginx:1.20.1
    container_name: my-app-nginx
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    ports:
      - 8080:80 # Este puerto es el que se expondrá al exterior para acceder a la aplicación
    depends_on:
      - frontend
      - backend

  # MongoDB service
  mongo:
    image: mongo:6
    container_name: my-app-mongo
    volumes:
      - mongo-data:/data/db
    # Mongo no necesita que se exponga el puerto, ya que backend accede a él internamente

  # Redis service
  redis:
    image: redis:7
    container_name: my-app-redis
    volumes:
      - redis-data:/data
    # Redis tampoco necesita puertos expuestos

# Volúmenes persistentes para Mongo y Redis
volumes:
  mongo-data:
  redis-data:



